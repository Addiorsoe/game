A('專精','專精規則','每 6 級獲得 1 點專精點（Lv6/12/…/60，共 10 點），不限定可用技能。每點可學習任一專精的一項能力；同一專精可多點，最多學滿 3 項。專精效果刻意與天賦群末梢的效果不重複。移除已學能力需 100×等級 金，重置全部需 500×等級 金。');
A('裝備','詞綴階級與區間','詞綴分為 T1–T5，階級越高越稀有：\n'+TIERS.map((x,i)=>`• T${i+1}：出現機率 ${x[2]}%，數值為基準值的 ${(x[0]*100).toFixed(0)}%–${(x[1]*100).toFixed(0)}%`).join('\n')+'\n詞綴階級依物品等級屏蔽（低等不出高階、高等不出低階）：\n'+TIERS.map((x,i)=>`• T${i+1}：物品 Lv${TLV[i][0]}–${Math.min(60,TLV[i][1])}`).join('\n')+'\n部分詞綴也有最低物品等級：暴擊傷害、攻速 Lv10，本地護甲% Lv8。融合時轉移過來的詞綴會依新基底等級換算數值並套用階級限制。\n基準值 = 詞綴係數 × 裝備需求等級。裝備詳情會列出每條詞綴的階級與區間。稀有度決定詞綴數量：'+AFN.map((n,i)=>RAR[i]+n+'條').join('、'));
A('裝備','稀有度與掉落','基礎掉落權重（普通/魔法/稀有/史詩/傳說/神話）：\n• 一般怪（每次擊殺 '+(DT.normal.p*100).toFixed(1)+'% 掉裝）：'+DT.normal.w.join('/')+'\n• 精英（60% 掉裝）：'+DT.elite.w.join('/')+'\n• 首領：'+DT.boss.w.join('/')+'；首次擊敗獲得專屬史詩裝備，再次擊敗有 '+(DT.boss.rep*100).toFixed(0)+'% 機率掉專屬傳說\n• 界主：每次 12～25% 掉該線神話（有保底）\n尋寶加成與詞綴可提高掉落機率。');
A('裝備','強化、洗鍊、鑄造、合成、融合','• 強化：+1~10，每級裝備基礎數值 +5%；金幣花費隨物品等級提高（×(1 + 物品等級÷20)）\n• 鑄造的金幣花費 ×(1 + 等級÷30)\n• 洗鍊：重新擲出隨機詞綴（可鎖定一條），500 金＋材料\n• 鑄造：消耗已收錄於圖鑑的裝備基底，獲得全新詞綴的該裝備（傳說／神話除外）\n• 合成：以多件低階裝備合成更高稀有度\n• 融合：兩件同欄位裝備，隨機保留詞條與詞綴，需融合精華');
A('裝備','本地與全域護甲（加法／乘法）','護甲類裝備有「基礎護甲」。隨機詞綴中：\n• 本地+（加法）：直接增加該裝備的基礎護甲\n• 本地×（乘法）：以百分比放大該裝備的基礎護甲\n• 裝備護甲 = (基礎護甲 + 本地加法) × (1 + 本地乘法%)，兩者都只作用在這件裝備上\n• 全域護甲：不屬於本地的「護甲」詞綴與天賦的護甲，直接加到角色總護甲；天賦的「全域護甲%」會放大角色總護甲（含所有裝備）\n• 總護甲 = (等級與屬性基礎 + 所有裝備護甲 + 全域護甲) × (1 + 全域護甲%)');
A('傷害','傷害轉換','某些傳奇詞條會把一種傷害轉換為另一種（例如物理→火焰、火焰→黑暗）。轉換後的傷害同時享有「轉換前」與「轉換後」兩種類型的增傷，且彼此「相加」而非相乘：\n• 物理→元素：同時吃物理傷害%與元素傷害%（相加）\n• 元素→元素：元素傷害%只計一次，但兩種元素的標籤增傷（如火焰技能傷害、黑暗技能傷害）都會加上\n• 異常狀態與元素互動則依轉換後的元素判定');
A('終局','平行世界','• Lv60 取得終極星圖後，在地圖頁開放 5 條平行世界：灼燒、凜冬、緋月、腐朽、重影，各自沿用一個區域的地形與怪物（Lv60），並加上主題怪物詞綴\n• 每條線有 3 個可選節點，獎勵事先顯示：指定欄位裝備、指定詞綴保底、金幣 ×3、材料 ×2、星燼、寶箱\n• 每 25 次擊殺通過一次節點（會自動重複目前節點；星痕節點只生效一次，通過後變回一般節點），錨定度 +20%；滿 100% 可挑戰「強化」首領\n• 首領給永久烙印：每條線 6 種，數值在範圍內隨機，每條線只保留 1 個，重打可換更好的\n• 每條線綁定神話（灼燒→滅世巨斧、凜冬→終焉之弓、緋月→不朽戰甲、腐朽→元素之心、重影→萬象法杖／萬物之戒），有保底計數：連續 8 次沒掉就必掉（夢蝕每 100 點縮短 2 次，最少 3 次）\n• 星燼 8 個可兌換一件圖鑑中見過的傳說（Lv60）');
A('終局','傳說歸屬地與追獵','• 每件傳說都有歸屬地（區域、首領或平行世界）。在歸屬區域掉落權重 ×4（精通 ★1 後 ×5），在其他區域只有 ×0.15；平行世界專屬傳說只在該平行世界掉落\n• 傳說的物品等級 = 掉落地點的等級，需求等級 = 物品等級 − 3；傳說另外帶 2 條隨機詞綴\n• 傳奇詞條與固定效果的強度隨物品等級成長：0.6 + 0.4 × 物品等級 ÷ 60（Lv60 為 100%）。第 10 版以後新增的詞條全部套用，較早的詞條只有固定效果套用\n• 開啟終極星圖後所有舊區域都是 Lv60，回到歸屬區域就能刷 60 級的那件傳說\n• 追獵：在圖鑑把一件已發現的傳說設為目標，在它的歸屬地每擊殺 1 隻精英 +1，到 60（精通 ★3 後 45）還沒掉就必掉');
A('終局','混沌遺物','• 開啟終極星圖或在平行世界中，傳說掉落有 20% 變成混沌遺物（混沌裂隙星痕中 50%），物品等級 60\n• 組成：4 條超越階隨機詞綴（T1 的 0.5～1.3 倍）＋1 條混沌核心＋2 條專精詞綴（穿上即生效，不佔專精點）\n• 混沌核心：三重共鳴（詞綴 ×3）、雙生（8 條詞綴各 ×1.5）、專精溢流（5 條專精詞綴＋6 條隨機詞綴 ×1.3）、傳奇寄生（3 條傳說詞條，詞綴 ×1.3）、極端（1 條詞綴 ×8）、鏡像（複製身上詞綴最多的另一件裝備，×2）、不穩定（詞綴 ×2，每 30 秒重擲專精詞綴）\n• 最多同時裝備 2 件。分解得星燼 5 個；混沌穩定（10 碎片，鎖 1 條重擲其餘）、專精重鑄（15 碎片，重擲 1 條專精詞綴）；每件有 10 點打造錨定度，用完就不能再改，但不會毀裝。混沌核心不能重擲');
A('終局','星痕','• 平行世界每個可選節點有 25% 帶星痕：難度與夢蝕不變，只換獎勵\n• 專精試煉：怪物生命 +15%，通過得星燼 1 個（6／12／24 個依序換永久專精點 +1，最多 +3）\n• 殘影首領：通過時改為挑戰一個舊區域首領（Lv60＋目前夢蝕），必掉該首領的專屬武器或防具（Lv60）\n• 混沌裂隙：怪物多帶 1 個隨機詞綴，傳說掉落權重 ×1.5\n• 追獵令：追獵目標在本節點的權重 ×10，通過時追獵計數 +20');
A('終局','星痕（第 13 版補完）','• 天賦回響：節點內天賦末梢機制的效果 ×1.5，通過得星燼 ×1\n• 灰燼竊賊：每 25 擊殺出現 1 隻會逃跑的竊賊（生命 ×4、移速 ×1.5），10 秒內沒打死就逃走；擊殺掉 3～5 件稀有以上裝備＋大量金幣\n• 烙印熔爐：通過得星燼 ×1，可在平行世界詳情重擲該線烙印的數值（保留大烙印）\n• 元素潮汐：節點指定 1 種元素，怪物對其他元素有 30% 抗性；掉落的裝備必含該元素詞綴（T1～T2）');
A('終局','舊區域星痕','• 開啟終極星圖後，在舊區域每 10 分鐘有 40% 機率出現隨機星痕，持續 5 分鐘（專精試煉、天賦回響、灰燼竊賊、元素潮汐、混沌裂隙、追獵令）\n• 星痕期間每 25 擊殺結算一次獎勵（竊賊星痕改為出現竊賊）\n• 每次出現都計入該區精通 ★4 的「觸發 3 次星痕」');
A('裝備','套裝切換','• 在裝備頁或鍛造頁的「套裝」卡片，可儲存 3 組套裝：目前的全部裝備、技能與輔助\n• 點「套用」一鍵換上；已分解或等級不足的物品會略過並提示\n• 按套裝旁的 ✕ 可刪除該組套裝，按「覆蓋」以目前裝備覆寫');
A('系統','導覽','• 手機底部：戰場／角色（含技能）／裝備（含鍛造、灰燼商人）／成長（專精＋天賦）／地圖（區域、平行世界、終局三個分頁）\n• 右上角「☰ 選單」：技能、鍛造、商人、專精、天賦、星燼神殿、圖鑑、辭典、成就與統計、設定\n• 「成長」上的紅色數字是還沒用掉的天賦點加專精點；「角色 ↑N」表示有 N 格可以換更好的裝備');
A('系統','收益統計與成就','• 戰場資訊列顯示近 10 秒 DPS；「成就與統計」頁顯示本次遊玩的擊殺、金幣、經驗、傳說、混沌與每小時數字（重新整理頁面會重算）\n• 成就共 44 個（首殺、等級、擊殺、平行世界、夢蝕、收藏、打造、竊賊、宿敵、試煉等），每 5 個讓金幣與經驗永久 +1%，上限 +8%');
A('終局','刷取成本','• 界主「界錨」：錨定度滿後第一次開打要付 2500×(1＋夢蝕÷30) 金（輸了重打不用再付，擊敗首領後下一輪重新計算）\n• 選擇星痕節點：3000×(1＋夢蝕÷150) 金（星痕只生效一次）\n• 星圖舊區域每 10 分鐘自動扣「灰燼通行費」區域等級×50 金（Lv60：3,000），扣不到時舊區域星痕與宿敵暫停\n• 首領挑戰開關（每次開打）：區域等級 ×200 金\n• 專精重鑄另加 30,000 金、烙印重鑄另加 10,000 金、兌換傳說另加 20,000 金、設定追獵目標 10,000 金（取消不退）');
A('終局','首領挑戰','• 地圖頁「首領挑戰」開關，只影響區域首領（不含平行世界）\n• 首領生命 ×2、攻擊 ×1.5，每次開打付區域等級 ×200 金\n• 擊敗多掉 1 件裝備，該件傳說權重 ×2');
A('終局','回憶試煉','• 星圖開啟後，在地圖「終局」分頁開始：連續挑戰 7 位區域首領（Lv60），死亡即失敗\n• 記錄最佳時間；每週第一次通過得星燼 1 個');
A('終局','宿敵','• 星圖開啟後在舊區域每擊殺 500 隻，出現一隻宿敵精英（生命 ×6）\n• 60 秒內擊敗必掉該區歸屬傳說（Lv60）；沒打倒會逃走並變強（每次生命 +25%、攻擊 +10%，最多 +10）');
A('裝備','灰燼商人','• 在「裝備 → 商人」分頁：選欄位花金幣買一件未鑑定裝備，物品等級＝目前區域等級\n• 稀有 3,000、史詩 12,000、傳說機會 40,000（8% 傳說，否則史詩；傳說池為該欄位所有非首領、非平行世界專屬的傳說，目前區域的歸屬傳說權重 ×4），都乘 (1＋物品等級÷60)\n• 可買的 6 個欄位每 10 分鐘刷新');
A('系統','星燼神殿','• 帳號永久升級，每項 5 級，價格 30,000×2.2^(等級)（第 5 級約 70 萬）\n• 離線上限 24→34 小時、離線效率（超過 8 小時的部分 50%→75%）、套裝欄位 3→5、舊區域星痕持續 300→400 秒、金幣獲取每級 +4%');
A('裝備','強化 +11～+15 與鎖定洗鍊','• +10 以上每級花費 20,000×1.6^(等級−10) 金，基礎屬性每級 +4%（+15 為 ×1.70），失敗率 +11 為 20%，每級 +10%（+15 為 60%），失敗只扣花費、不降級\n• 洗鍊可以鎖 1～2 條詞綴：金幣 ×4／×12，材料每鎖 1 條多 3 個；洗鍊金幣為 500×(1＋物品等級÷20)\n• 打造潛能：每件裝備 30 點，每次強化（不論成敗）或洗鍊用 1 點；用完要在鍛造頁花 1 個融合精華＋20,000 金補 10 點');
A('裝備','外觀幻化','• 物品詳情的「幻化」：選圖鑑見過的同欄位外形（主手限同武器類型），第一次使用某個外形 10,000 金解鎖，之後免費\n• 純外觀，不影響數值');
A('系統','構築分享碼','• 設定頁「構築分享碼」：匯出 AB15: 開頭的文字（天賦、專精、技能、輔助），或貼上別人的碼套用\n• 套用時天賦依目前點數與連線條件逐一學習，學不到的會略過並提示');
A('終局','夢蝕祭壇','• 平行世界詳情的「夢蝕祭壇」：花 50,000×(1＋夢蝕÷100) 金，讓這條平行世界 30 分鐘內傳說、史詩權重與金幣 ×1.25\n• 效果用現實時間計算，離開平行世界也會繼續倒數');
A('成長','元素印記','• 用物理、火、冰、電、血、暗、腐蝕、神聖其中一種元素擊殺敵人會累積該元素的印記經驗（以最後一擊的元素計算）\n• 擊殺 300／1,500／5,000／15,000／40,000 次升 1～5 級；1～4 級每級該元素傷害 +5%，5 級再 +10% 並得到效果：'+EMR.map(el=>ELN[el]+' '+EMX[el]).join('；')+'\n• 在「成長 → 星座與印記」查看');
A('成長','灰燼星座','• Lv60 取得終極星圖後開放的第二張成長盤，每擊敗 3 次界主得 1 點（最多 24 點，8 個星座共 40 顆星，只能點滿約 5 個）\n• 8 個星座各 5 顆星：獵戶（更多傷害）、巨熊（生命）、蒼鷹（暴擊率）、孤狼（攻速）、玄龜（減傷）、火鳳（回復）、銀蛇（暴擊傷害）、金蛛（掉寶）\n• 第 5 顆星的質變：'+CST.map((c,i)=>c[0]+' '+CST5[i]).join('；')+'\n• 下排 4 個星座需要上排對應星座先點 3 顆；重置每點 5,000 金');
A('系統','存檔匯出與匯入','• 存檔只存在目前這個瀏覽器（IndexedDB＋localStorage 備份）。換裝置或清除瀏覽器資料前，請到設定頁「匯出存檔」\n• 匯出：複製一段以 AE14: 開頭的文字，或下載 .txt 檔\n• 匯入：貼上文字或選擇檔案，確認存檔內容後覆蓋；覆蓋前會自動備份目前進度，設定頁可「還原匯入前備份」');
A('裝備','全部換最佳','• 角色頁的「全部換最佳」會逐格比較背包裡可以穿的裝備，依「傷害值 ×0.6＋生存值 ×0.4」的提升換上\n• 主手只考慮目前的武器類型，避免技能被換掉\n• 背包格子出現綠色 ↑、底部「角色」標籤出現 ↑N，表示有更好的裝備可以換');
A('裝備','夢染與神化','• 兩者都是「終極打造」：做完後裝備封印，不能再強化、洗鍊、融合\n• 夢染（3000×(1＋物品等級÷20) 金＋精華 ×2）：60% 加上 1 條特殊詞綴；25% 加上特殊詞綴但 1 條隨機詞綴降 1 階；15% 沒有變化（仍然封印）。特殊詞綴有更多傷害 3.5～7%、暴擊率、暴擊傷害 12～25%、攻速、減傷 2～4%、吸血、召喚物、持續、範圍、掉寶、移速、冷卻，數值隨物品等級成長；裝備顯示「污」\n• 神化（5000×(1＋物品等級÷20) 金＋精華 ×(1＋稀有度)）：全部隨機詞綴升 1 階並再 ×1.08，T1 改為 ×1.35×1.08；傳說與神話的固定效果另外 ×1.2；裝備顯示「神」\n• 夢染的上限較高但有風險，神化穩定；兩者只能擇一\n• 建議先把強化與洗鍊做到滿意再使用');
A('裝備','鍛造篩選','• 鍛造頁上方列出目前已裝備的物品，點一下直接選為鍛造對象\n• 「更換裝備」視窗可依欄位篩選、只看已裝備、用名稱搜尋；已裝備的物品排在最前面並標示 E');
A('終局','區域精通與圖鑑收藏','• 開啟終極星圖後，7 個舊區域各有 5 星精通（依序達成）：★1 擊殺 300 隻（歸屬權重 ×5）、★2 擊敗該區首領 3 次（星燼 ×2）、★3 撿到 3 件歸屬傳說（追獵保底 45）、★4 擊殺 1000 隻（星燼 ×5）、★5 收集該區全部歸屬傳說（該區首領專屬傳說的第 1 條詞綴必為 T1）\n• 星燼每 12 個換永久天賦點 +1，最多 +5\n• 圖鑑收藏：收集某區全部歸屬傳說得永久加成（灰星海岸金幣 +10%、腐沼異常持續 +10%、霜葬暴擊傷害 +10%、雷鑄攻速 +4%、血宴生命 +5%、虛空範圍 +8%、墜星全傷害 +5%）；首領專屬全收對首領傷害 +10%；平行世界專屬全收夢蝕金幣 +10%');
A('終局','灰燼夢蝕','• 每擊敗一次界主，該線夢蝕 +5（可在平行世界詳情關閉）\n• 每 1 點夢蝕：怪物生命與攻擊 +2%、金幣 +1%；史詩與傳說的掉落權重隨夢蝕提高，神話機率 +0.2%（上限 25%）\n• 夢蝕 100 以後收益遞減，夢蝕 60 以後怪物加速變強：傳說與史詩權重每點只再 +1/300、金幣每點 +0.5%；怪物生命與攻擊從夢蝕 60 起再乘 1.015^(夢蝕−60)（夢蝕 100 約 ×1.8、150 約 ×3.8、200 約 ×8）\n• 夢蝕 100 以上掉落的 Lv60 裝備，T1 詞綴有機會變成只能掉落的 T0（數值 1.7～2.1 倍基準，夢蝕越高機率越高，最多 12%；夢蝕祭壇燃燒期間 ×1.5）\n• 夢蝕 100 以上，首領給「大烙印」（數值 ×1.5），神話保底縮短\n• 能力有上限（每條線 1 個烙印），難度沒有上限；最高夢蝕會記錄下來');
A('裝備','掉落篩選','• 在設定頁開啟。沒通過篩選的掉落直接分解成材料與金幣，離線收益也適用\n• 可設定：最低保留稀有度、只留目前武器類型的主手、必須含有某類詞綴（火焰、冰冷、暴擊、生命、護甲、攻速…）；含 T0 詞綴的裝備預設一律保留（可關閉）\n• 傳說與神話一律保留；鍛造、合成、融合的成品不受影響');
A('裝備','神話獨有詞條','• 萬象法杖「萬象」：每次元素反應傷害 +6%，最多 11 層\n• 終焉之弓「終焉」：投射物 +2 但不穿透，更多傷害 ×1.4\n• 滅世巨斧「滅世」：近戰命中 25% 引發 80% 火焰餘震（內置冷卻 0.3 秒）\n• 不朽戰甲「不朽」：致命傷改為保留 50% 生命並無敵 2 秒（冷卻 60 秒）\n• 灰燼誓約劍「灰燼誓約」（肉生之界）：每次翻滾後 3 秒內近戰傷害 ×1.4，可疊 2 層\n• 元素之心「元素之心」：每 4 秒輪替一種元素，該元素傷害 ×1.6\n• 萬物之戒「萬物」：每件已裝備的傳說以上物品，更多傷害 +5%（至少以 6 件計算）、生命 +4%\n• 每件已裝備的神話：最大生命 +15%\n• 獨有詞條不能被融合帶走');
A('區域','離線收益','• 離線最多結算 24 小時，超過 8 小時的部分效率減半\n• 效率 = min(在線平均擊殺效率, 0.2/秒) × 0.75；每 10 次擊殺擲一次精英掉落（60%），裝備最多 60 件，會套用掉落篩選');
A('區域','區域、小區域與終極星圖','• 全部 7 個大區域，每個大區域再依等級切成約 5 等一格的小區域（例如 Lv6–9、Lv10–12），怪物等級落在該小區域範圍內（隨你的等級夾在範圍內）\n• 裝備掉落與怪物等級掛鉤：只會掉落約「怪物等級 −6 到 +2」的裝備；找不到時取最接近的裝備\n• 達到 Lv60 取得「終極星圖」，可在地圖頁啟用：所有區域的怪物提升至 Lv60，裝備掉落也以 Lv60 為準\n• 裝備需求等級每格間距約 1–2 級（共 48 個等級階，每欄位 48 件）');
A('通貨','通貨與材料','金幣、8 種區域材料、融合精華。可在「裝備」頁最上方查看，點擊各通貨會顯示功效與用途。');
A('操作','戰鬥與自動化','角色自動鎖定目標、施放技能、拾取、升級。空白鍵／翻滾鈕可手動翻滾。速度 1–3×。離線時會結算離線收益。');
A('天賦','天賦樹','共 '+CLU.length+' 個天賦群（'+CLU.map(a=>a[0]).join('、')+'）。群內過路節點效果通用化，末梢有 4 個多樣分支（例：閃電群末梢可選 閃電傷害＋攻速／暴擊率／暴擊幸運／魔力恢復），並刻意與專精的效果不重複。天賦群依屬性方位排列（上＝智力、右下＝敏捷、左下＝力量），路上穿插屬性點，中圈的屬性環可橫向走到相鄰群。每級 +1 天賦點，每 5 級再 +1。\n關鍵點：\n'+TN.filter(n=>n.ks).map(n=>'• '+n.name+'：'+n.d).join('\n'));

function corRoll(it,x){const q=x!==undefined?x:rnd();it.sl2='cor';if(q>=.85){it.cor=0;return itN(it)+' 沒有變化（仍然封印）。'}const p=pick(CORP),k=lgS(it);let v=p[1]+rnd()*(p[2]-p[1]);v=p[0]==='mcnt'?1:+(v*k).toFixed(3);it.ca=[p[0],v];let t=itN(it)+' 獲得夢染詞綴：<b style="color:#d77cff">'+KN[p[0]]+' +'+fmt(p[0],v)+'</b>';if(q>=.6&&it.af.length){const f=pick(it.af),tt=f[2]||0;if(tt>=0&&tt<4){const mid=i=>(TIERS[i][0]+TIERS[i][1])/2,a=AFX.find(y=>y.k===f[0]),nv=f[1]*mid(tt+1)/mid(tt);f[1]=a&&a.int?Math.max(1,Math.round(nv)):+nv.toFixed(3);f[2]=tt+1;t+='<br><span class="dn">代價：'+KN[f[0]]+' 降為 T'+(tt+2)+'</span>'}}return t}
